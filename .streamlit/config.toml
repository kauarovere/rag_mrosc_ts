[theme]
primaryColor             = "#a78bfa"   # roxo claro — slider, radio, checkboxes
backgroundColor          = "#1c1c1c"   # carvão escuro — fundo principal (estilo Claude)
secondaryBackgroundColor = "#252525"   # carvão médio — sidebar, cards
textColor                = "#e8e6e1"   # off-white quente — texto principal
font                     = "sans serif"
